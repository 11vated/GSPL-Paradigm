<!DOCTYPE html><html><head><meta charset="UTF-8"><title>GSPL v3</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0e1a;color:#e0e0e0;font-family:sans-serif}.hd{padding:16px 24px;border-bottom:1px solid #1a2040}.hd h1{font-size:20px;color:#7af0c0}.hd p{font-size:11px;opacity:.5;margin-top:3px}.gr{display:flex;flex-wrap:wrap;padding:12px;gap:12px;justify-content:center}.cd{background:#111828;border:1px solid #1a2040;border-radius:10px;overflow:hidden;width:380px}.cd:hover{border-color:#7af0c0}.cd canvas{width:380px;height:300px;display:block}.nf{padding:8px 12px}.nf h3{font-size:13px;color:#fff;margin-bottom:4px}.tg{background:#1a2844;padding:2px 7px;border-radius:3px;font-size:10px;color:#7af0c0;margin-right:3px}.ct{position:fixed;bottom:12px;right:12px;background:#111828ee;border:1px solid #1a2040;border-radius:8px;padding:10px 14px;font-size:10px;z-index:10;backdrop-filter:blur(8px)}.ct label{display:flex;align-items:center;gap:5px;margin-bottom:5px}.ct input[type=range]{width:100px;accent-color:#7af0c0}.vl{width:18px;text-align:right;color:#7af0c0;font-size:9px}.er{color:#f44;font-size:9px;padding:4px 12px}</style></head><body><div class=hd><h1>GSPL v3 — Faces + Hair + Equipment + Species + Textures</h1><p>8 entities. 59 SDF ops. Reverted math functions to correct form.</p></div><div class=ct><label>Emotion<input type=range id=se min=0 max=100 value=0><span class=vl id=ve>0</span></label><label>Transform<input type=range id=st min=0 max=100 value=0><span class=vl id=vt>0</span></label><label>Power<input type=range id=sp min=0 max=100 value=0><span class=vl id=vp>0</span></label></div><div class=gr id=g></div><script>const V="#version 300 es\nin vec2 a_position;\nvoid main() { gl_Position = vec4(a_position, 0.0, 1.0); }\n",E=[{"label":"Fire Knight","fragment":"#version 300 es\nprecision highp float;\n\nuniform vec2 u_resolution;\nuniform float u_time;\nuniform vec2 u_mouse;       // Normalized mouse position (0-1)\nuniform float u_emotion;    // 0.0 = calm, 1.0 = rage (changes aura color/intensity)\nuniform float u_transform;  // 0.0 = base form, 1.0 = fully transformed (morph + color shift)\nuniform float u_power;      // 0.0 = dormant, 1.0 = active (ability VFX)\nout vec4 fragColor;\n\n\n// Smooth minimum — blends two SDFs with configurable smoothness\nfloat smin(float a, float b, float k) {\n  float h = clamp(0.5 + 0.5*(b-a)/k, 0.0, 1.0);\n  return mix(b, a, h) - k*h*(1.0-h);\n}\n\n// SDF primitives — fundamental shapes parameterized by dimensions\nfloat sdSphere(vec3 p, float r) { return length(p) - r; }\nfloat sdEllipsoid(vec3 p, vec3 r) { float k0 = length(p/r); float k1 = length(p/(r*r)); return k0*(k0-1.0)/k1; }\nfloat sdCapsule(vec3 p, float h, float r) { p.y -= clamp(p.y, 0.0, h); return length(p) - r; }\nfloat sdBox(vec3 p, vec3 b) { vec3 q = abs(p) - b; return length(max(q,0.0)) + min(max(q.x,max(q.y,q.z)),0.0); }\nfloat sdCylinder(vec3 p, float h, float r) { vec2 d = abs(vec2(length(p.xz),p.y)) - vec2(r,h); return min(max(d.x,d.y),0.0) + length(max(d,0.0)); }\nfloat sdCone(vec3 p, float r, float h) { vec2 q = h*vec2(r/h,-1.0); vec2 w = vec2(length(p.xz), p.y); return max(dot(w,normalize(q)), -p.y-h); }\n\n// Boolean operations\nfloat opUnion(float a, float b) { return min(a, b); }\nfloat opSubtract(float a, float b) { return max(-a, b); }\n\n// Noise for procedural detail\nfloat hash3(vec3 p) { p = fract(p * 0.3183099 + .1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }\nfloat noise3(vec3 x) {\n  vec3 i = floor(x); vec3 f = fract(x); f = f*f*(3.0-2.0*f);\n  return mix(mix(mix(hash3(i+vec3(0,0,0)), hash3(i+vec3(1,0,0)),f.x),\n                 mix(hash3(i+vec3(0,1,0)), hash3(i+vec3(1,1,0)),f.x),f.y),\n             mix(mix(hash3(i+vec3(0,0,1)), hash3(i+vec3(1,0,1)),f.x),\n                 mix(hash3(i+vec3(0,1,1)), hash3(i+vec3(1,1,1)),f.x),f.y),f.z);\n}\nfloat fbm3(vec3 x) {\n  float v = 0.0; float a = 0.5;\n  for (int i = 0; i < 3; ++i) { v += a * noise3(x); x = x * 2.0 + vec3(100.0); a *= 0.5; }\n  return v;\n}\n\n// Rotation helpers\nmat2 rot2(float a) { float s = sin(a), c = cos(a); return mat2(c, -s, s, c); }\nvec3 rotX(vec3 p, float a) { p.yz *= rot2(a); return p; }\nvec3 rotY(vec3 p, float a) { p.xz *= rot2(a); return p; }\nvec3 rotZ(vec3 p, float a) { p.xy *= rot2(a); return p; }\n\n// v2: Advanced SDF operations\nfloat sdTorus(vec3 p, float R, float r) { vec2 q = vec2(length(p.xz) - R, p.y); return length(q) - r; }\nfloat sdRoundBox(vec3 p, vec3 b, float r) { vec3 q = abs(p) - b; return length(max(q,0.0)) + min(max(q.x,max(q.y,q.z)),0.0) - r; }\nfloat opSmoothSubtract(float d1, float d2, float k) { float h = clamp(0.5 - 0.5*(d2+d1)/k, 0.0, 1.0); return mix(d2, -d1, h) + k*h*(1.0-h); }\nfloat opSmoothIntersect(float d1, float d2, float k) { float h = clamp(0.5 - 0.5*(d2-d1)/k, 0.0, 1.0); return mix(d2, d1, h) + k*h*(1.0-h); }\nvec3 opTwist(vec3 p, float k) { float c = cos(k*p.y); float s = sin(k*p.y); mat2 m = mat2(c,-s,s,c); return vec3(m*p.xz, p.y); }\nvec3 opBend(vec3 p, float k) { float c = cos(k*p.x); float s = sin(k*p.x); mat2 m = mat2(c,-s,s,c); return vec3(p.x, m*p.yz); }\nfloat opShell(float d, float thickness) { return abs(d) - thickness; }\nfloat opRound(float d, float r) { return d - r; }\nvec3 opElongate(vec3 p, vec3 h) { vec3 q = p - clamp(p, -h, h); return q; }\n\n// v2: Cel-shading helper — quantize diffuse to N bands\nfloat celShade(float d, float bands) { return floor(d * bands + 0.5) / bands; }\n\n// v2: Fresnel for rim lighting\nfloat fresnelSchlick(float cosTheta, float f0) { return f0 + (1.0 - f0) * pow(1.0 - cosTheta, 5.0); }\n\n// v2: Aura/particle effect helpers\nfloat auraPulse(vec3 p, float time, float intensity) {\n  float r = length(p);\n  float pulse = sin(r * 8.0 - time * 4.0) * 0.5 + 0.5;\n  return pulse * intensity * smoothstep(1.5, 0.0, r);\n}\n\n// ═══════════════════════════════════════════════════════\n// v3: EXPANDED SDF ARSENAL — 29 new operations (21→50)\n// Based on Inigo Quilez's established SDF formulas\n// ═══════════════════════════════════════════════════════\n\n// ── New Primitives (7→18) ──────────────────────────\n\n// Rounded cone — tapered capsule (horns, tails, limbs with taper)\nfloat sdRoundCone(vec3 p, float r1, float r2, float h) {\n  vec2 q = vec2(length(p.xz), p.y);\n  float b = (r1-r2)/h;\n  float a = sqrt(1.0-b*b);\n  float k = dot(q,vec2(-b,a));\n  if(k < 0.0) return length(q) - r1;\n  if(k > a*h) return length(q-vec2(0.0,h)) - r2;\n  return dot(q, vec2(a,b)) - r1;\n}\n\n// Triangular prism — blades, fins, wedge shapes\nfloat sdTriPrism(vec3 p, vec2 h) {\n  vec3 q = abs(p);\n  return max(q.z-h.y,max(q.x*0.866025+p.y*0.5,-p.y)-h.x*0.5);\n}\n\n// Hexagonal prism — crystals, insect segments, honeycomb\nfloat sdHexPrism(vec3 p, vec2 h) {\n  vec3 q = abs(p);\n  return max(q.z-h.y,max(q.x*0.866025+q.y*0.5,q.y)-h.x);\n}\n\n// Octahedron — diamond/gem shapes\nfloat sdOctahedron(vec3 p, float s) {\n  p = abs(p);\n  float m = p.x+p.y+p.z-s;\n  vec3 q;\n  if(3.0*p.x < m) q = p.xyz;\n  else if(3.0*p.y < m) q = p.yzx;\n  else if(3.0*p.z < m) q = p.zxy;\n  else return m*0.57735027;\n  float k = clamp(0.5*(q.z-q.y+s),0.0,s);\n  return length(vec3(q.x,q.y-s+k,q.z-k));\n}\n\n// Pyramid — 4-sided pyramid with height h and unit base\nfloat sdPyramid(vec3 p, float h) {\n  float m2 = h*h + 0.25;\n  p.xz = abs(p.xz);\n  p.xz = (p.z>p.x) ? p.zx : p.xz;\n  p.xz -= 0.5;\n  vec3 q = vec3(p.z, h*p.y - 0.5*p.x, h*p.x + 0.5*p.y);\n  float s = max(-q.x, 0.0);\n  float t = clamp((q.y - 0.5*p.z)/(m2 + 0.25), 0.0, 1.0);\n  float a = m2*(q.x+s)*(q.x+s) + q.y*q.y;\n  float b = m2*(q.x+0.5*t)*(q.x+0.5*t) + (q.y-m2*t)*(q.y-m2*t);\n  float d2 = max(min(q.y,-q.x*m2-q.y*0.5), 0.0) > 0.0 ? 0.0 : min(a,b);\n  return sqrt((d2+q.z*q.z)/m2) * sign(max(q.z,-p.y));\n}\n\n// Solid angle (wedge) — claws, teeth, beaks\nfloat sdSolidAngle(vec3 p, vec2 c, float r) {\n  vec2 q = vec2(length(p.xz), p.y);\n  float l = length(q) - r;\n  float m = length(q - c*clamp(dot(q,c),0.0,r));\n  return max(l, m*sign(c.y*q.x-c.x*q.y));\n}\n\n// Infinite plane — ground, walls, wing membranes\nfloat sdPlane(vec3 p, vec3 n, float h) { return dot(p,n) + h; }\n\n// Revolution — spin 2D profile around Y axis (wheels, vases, columns)\nfloat sdRevolution(vec3 p, float sdfY, float sdfR, float offset) {\n  vec2 q = vec2(length(p.xz) - offset, p.y);\n  return length(q) - sdfR;\n}\n\n// Extrude linear — pull 2D circle into 3D cylinder along Y\nfloat sdExtrudeY(vec3 p, float r, float h) {\n  vec2 d = vec2(length(p.xz) - r, abs(p.y) - h);\n  return min(max(d.x,d.y),0.0) + length(max(d,0.0));\n}\n\n// Bezier quadratic curve distance (approximate)\nfloat sdBezierApprox(vec3 p, vec3 a, vec3 b, vec3 c) {\n  vec3 ab = b - a; vec3 bc = c - b; vec3 ac = c - a;\n  vec3 ap = p - a;\n  float t = clamp(dot(ap, ac) / dot(ac, ac), 0.0, 1.0);\n  vec3 pt = a + ab*2.0*t*(1.0-t) + ac*t*t;\n  return length(p - pt);\n}\n\n// ── New Combination Operations (3→10) ──────────────\n\n// Chamfer — flat bevel edge between two surfaces (mechanical, armor panel lines)\nfloat opChamfer(float a, float b, float r) {\n  return min(min(a,b), (a - r + b)*0.7071);\n}\n\n// Fillet — smooth round transition (organic)\nfloat opFillet(float a, float b, float r) {\n  vec2 u = max(vec2(r-a, r-b), vec2(0.0));\n  return max(r, min(a,b)) - length(u);\n}\n\n// Stair union — stepped blend (crystal growth, terraced)\nfloat opStairUnion(float a, float b, float r, float n) {\n  float s = r/n;\n  float u = b-r;\n  return min(min(a,b), 0.5*(u+a+abs(mod(u-a+s, 2.0*s)-s)));\n}\n\n// Column union — columnar blend (organic tissue, vein-like)\nfloat opColumnUnion(float a, float b, float r) {\n  if (abs(a) < r && abs(b) < r) {\n    float ar = a/r; float br = b/r;\n    float v = max(0.0, 1.0 - ar*ar - br*br);\n    return min(a,b) - r*(1.0 - sqrt(v));\n  }\n  return min(a,b);\n}\n\n// Groove — carved channel (panel seams, detail lines)\nfloat opGroove(float a, float b, float r, float d) {\n  return max(a, min(b+d, -b+r));\n}\n\n// ── New Domain Operations (5→15) ───────────────────\n\n// Repeat infinite — scales, rivets, tiles\nvec3 opRepeatXYZ(vec3 p, vec3 s) { return mod(p+s*0.5, s) - s*0.5; }\n\n// Repeat limited — bounded repetition (teeth, spine ridges, fingers)\nvec3 opRepeatLimited(vec3 p, float s, vec3 lim) {\n  return p - s*clamp(round(p/s), -lim, lim);\n}\n\n// Repeat polar — radial repetition (petals, wheel spokes, tentacles)\nvec3 opRepeatPolar(vec3 p, float n) {\n  float angle = 6.2831853/n;\n  float a = atan(p.z, p.x);\n  float r = length(p.xz);\n  a = mod(a + angle*0.5, angle) - angle*0.5;\n  return vec3(r*cos(a), p.y, r*sin(a));\n}\n\n// Mirror — bilateral symmetry\nvec3 opMirror(vec3 p) { p.x = abs(p.x); return p; }\n\n// 4-fold symmetry (starfish, flowers)\nvec3 opSymmetry4(vec3 p) { p.xz = abs(p.xz); return p; }\n\n// Displacement — noise-driven surface perturbation\nfloat opDisplace(float d, vec3 p, float amt) {\n  return d + (noise3(p * 4.0) - 0.5) * amt;\n}\n\n// Onion — concentric shells (layered armor, auras, energy rings)\nfloat opOnion(float d, float thickness) { return abs(d) - thickness; }\n\n// Taper — progressive scaling along Y axis\nvec3 opTaper(vec3 p, float amount) {\n  float s = 1.0 - p.y * amount;\n  return vec3(p.x / max(s, 0.01), p.y, p.z / max(s, 0.01));\n}\n\n// Cheap bend — fast approximation for large deformations\nvec3 opCheapBend(vec3 p, float k) {\n  float c = cos(k*p.y); float s = sin(k*p.y);\n  mat2 m = mat2(c,-s,s,c);\n  vec2 xz = m * p.xz;\n  return vec3(xz.x, p.y, xz.y);\n}\n\n// ── New Texture Operations (0→7) ───────────────────\n\n// Voronoi — cell patterns (scales, cracks, veins)\nvec2 voronoi(vec2 x) {\n  vec2 n = floor(x); vec2 f = fract(x);\n  float md = 8.0; vec2 mr;\n  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++) {\n    vec2 g = vec2(float(i),float(j));\n    vec2 o = vec2(hash3(vec3(n+g,0.0)), hash3(vec3(n+g,1.0)));\n    vec2 r = g + o - f;\n    float d = dot(r,r);\n    if(d<md){ md=d; mr=r; }\n  }\n  return vec2(md, length(mr));\n}\n\n// Worley noise — organic cellular texture (2D for perf, projected from xz)\nfloat worley(vec3 p) {\n  vec2 n = floor(p.xz); vec2 ff = fract(p.xz);\n  float md = 1.0;\n  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++) {\n    vec2 g = vec2(float(i),float(j));\n    vec2 o = vec2(hash3(vec3(n+g,0.0)), hash3(vec3(n+g,1.0)));\n    float d = length(g + o - ff);\n    md = min(md, d);\n  }\n  return md;\n}\n\n// Stripe pattern — directional bands (tiger, zebra)\nfloat stripePattern(vec3 p, float freq, float thick) {\n  return smoothstep(thick, thick-0.05, abs(sin(p.x*freq + fbm3(p*2.0)*2.0)));\n}\n\n// Spot pattern — radial dots (leopard, dalmatian)\nfloat spotPattern(vec3 p, float scale, float size) {\n  vec2 v = voronoi(p.xz * scale);\n  return smoothstep(size, size*0.5, v.x);\n}\n\n// Weave pattern — interlocking grid (fabric, chainmail)\nfloat weavePattern(vec3 p, float scale) {\n  vec2 uv = fract(p.xz * scale);\n  float h = step(0.5, uv.x);\n  float v = step(0.5, uv.y);\n  return abs(h - v);\n}\n\n// Triplanar projection — seamless 3D texture application\nvec3 triplanar(vec3 p, vec3 n, float scale) {\n  vec3 bf = abs(n); bf /= (bf.x+bf.y+bf.z);\n  float tx = noise3(vec3(p.yz * scale, 0.0));\n  float ty = noise3(vec3(p.xz * scale, 0.0));\n  float tz = noise3(vec3(p.xy * scale, 0.0));\n  return vec3(tx*bf.x + ty*bf.y + tz*bf.z);\n}\n\n// Scale pattern — Voronoi-based for dragons/reptiles\nfloat scalePattern(vec3 p, float scale) {\n  vec2 v = voronoi(p.xz * scale);\n  return smoothstep(0.4, 0.35, v.y);\n}\n\n\n// Gene-driven SDF entity (humanoid body plan)\nfloat mapEntity(vec3 p) {\n  // Motion genes control idle animation\n  p *= 1.0 + sin(u_time * 2.0000) * 0.0400;\np.x += sin(u_time * 1.0000) * 0.0200;\n\n  // Body plan compiled from bodyParams + appendages genes\n  \n  // Torso (morphology-scaled: exag=0.5000, musc=0.5000)\n  float torso = sdCapsule(p - vec3(0.0, 0.0, 0.0), 0.4500, 0.2818);\n  // Head (scaled by headToBodyRatio + exaggeration)\n  float head = sdSphere(p - vec3(0.0, 0.7777, 0.0), 0.2317);\n  // Neck\n  float neck = sdCapsule(p - vec3(0.0, 0.4500, 0.0), 0.0960, 0.0933);\n\n  // Arms (symmetric, morphology-scaled)\n  vec3 armP = p;\n  armP.x = abs(armP.x);\n  vec3 armStart = vec3(0.3317, 0.3600, 0.0);\n  vec3 armLocal = armP - armStart;\n  armLocal = rotZ(armLocal, 0.3 + sin(u_time * 2.0) * 0.08);\n  float arms = sdCapsule(armLocal, 0.5015, 0.1166);\n\n  // Legs (symmetric, morphology-scaled)\n  vec3 legP = p;\n  legP.x = abs(legP.x);\n  vec3 legStart = vec3(0.1409, -0.05, 0.0);\n  vec3 legLocal = legP - legStart;\n  float phase = p.x > 0.0 ? 1.0 : -1.0;\n  legLocal = rotX(legLocal, sin(u_time * 3.0) * 0.15 * phase);\n  float legs = sdCapsule(legLocal - vec3(0.0, -0.05, 0.0), 0.5516, 0.1283);\n\n  // Combine with smooth blending\n  float body = smin(torso, neck, 0.0800);\n  body = smin(body, head, 0.0800);\n  body = smin(body, arms, 0.0480);\n  body = smin(body, legs, 0.0480);\n  // ── Face Features ──────────────────────────\n  vec3 headCenter = vec3(0.0, 0.7777, 0.0);\n  float faceForward = 0.1969;\n  // Eyes (carved into head)\n  vec3 eyeP = p; eyeP.x = abs(eyeP.x);\n  float eyeCarve = sdSphere(eyeP - vec3(0.0649, 0.8125, faceForward), 0.0389);\n  body = max(body, -eyeCarve - 0.003);\n  // Pupils (raised dots in eye sockets)\n  float pupil = sdSphere(eyeP - vec3(0.0649, 0.8125, 0.2086), 0.0195);\n  body = smin(body, pupil, 0.005);\n  // Nose\n  float nose = sdSphere(p - vec3(0.0, 0.7661, 0.2201), 0.0139);\n  body = smin(body, nose, 0.02);\n  // Mouth (carved line)\n  float mouthCarve = sdCapsule(vec3(abs(p.x), p.y - 0.7314, p.z - 0.1871), 0.0463, 0.0035);\n  body = max(body, -mouthCarve - 0.002);\n  // Ears\n  vec3 earP = p; earP.x = abs(earP.x);\n  float ears = sdEllipsoid(earP - vec3(0.2132, 0.7777, 0.0), vec3(0.0104, 0.0348, 0.0070));\n  body = smin(body, ears, 0.03);\n  // ── Hair Volume ──────────────────────────\n  // Spiky hair (upward bias + noise spikes)\n  vec3 hairP = p - vec3(0.0, 0.7777, 0.0);\n  float hairShell = sdSphere(hairP, 0.2665) - 0.1050;\n  // Noise spikes pointing upward\n  hairShell -= fbm3(hairP * 8.0) * 0.0630;\n  hairShell -= max(0.0, hairP.y) * 0.1575; // Upward bias\n  hairShell = max(hairShell, sdSphere(hairP, 0.2201)); // Don't go inside head\n  body = smin(body, hairShell, 0.02);\n  // ── Armor ──────────────────────────\n  // Chest plate\n  float chestPlate = sdBox(p - vec3(0.0, 0.1800, 0.0), vec3(0.3240, 0.2025, 0.1831));\n  chestPlate = opRound(chestPlate, 0.02);\n  body = smin(body, chestPlate, 0.01);\n  // Shoulder guards\n  vec3 shP = p; shP.x = abs(shP.x);\n  float shoulderGuard = sdSphere(shP - vec3(0.3599, 0.3375, 0.0), 0.0620);\n  body = smin(body, shoulderGuard, 0.015);\n  // Belt\n  float belt = sdTorus(vec3(p.x, p.y + 0.01, p.z) - vec3(0.0, 0.0, 0.0), 0.2677, 0.018);\n  body = smin(body, belt, 0.01);\n  // Helmet (expanded head with visor slit)\n  float helmet = sdSphere(p - vec3(0.0, 0.7777, 0.0), 0.2734);\n  float visorSlit = sdBox(p - vec3(0.0, 0.7777, 0.2549), vec3(0.1390, 0.0185, 0.05));\n  helmet = max(helmet, -visorSlit);\n  body = smin(body, helmet, 0.01);\n  // Axe (handle + head)\n  vec3 axeP = p - vec3(0.6815, 0.1350, 0.05);\n  axeP = rotZ(axeP, -0.3);\n  float axeHandle = sdCapsule(axeP, 0.3, 0.012);\n  float axeHead = sdBox(axeP - vec3(0.03, 0.25, 0.0), vec3(0.06, 0.04, 0.008));\n  body = min(body, min(axeHandle, axeHead));\n  return body;\n}\n\nfloat map(vec3 p) {\n  float entity = mapEntity(p);\n  float floor_ = p.y + 1.2;\n  return min(entity, floor_);\n}\n\nvec3 calcNormal(vec3 p) {\n  const float e = 0.001;\n  return normalize(vec3(\n    map(p + vec3(e,0,0)) - map(p - vec3(e,0,0)),\n    map(p + vec3(0,e,0)) - map(p - vec3(0,e,0)),\n    map(p + vec3(0,0,e)) - map(p - vec3(0,0,e))\n  ));\n}\n\nvoid main() {\n  vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;\n\n  // Orbiting camera\n  vec3 ro = vec3(sin(u_time * 0.25) * 2.5, 1.2, cos(u_time * 0.25) * 2.5 + 2.0);\n  vec3 ta = vec3(0. orm, 1.0 = fully transformed (morph + color shift)\nuniform float u_power;      // 0.0 = dormant, 1.0 = active (ability VFX)\nout vec4 fragColor;\n\n\n// Smooth minimum — blends two SDFs with configurable smoothness\nfloat smin(float a, float b, float k) {\n  float h = clamp(0.5 + 0.5*(b-a)/k, 0.0, 1.0);\n  return mix(b, a, h) - k*h*(1.0-h);\n}\n\n// SDF primitives — fundamental shapes parameterized by dimensions\nfloat sdSphere(vec3 p, float r) { return length(p) - r; }\nfloat sdEllipsoid(vec3 p, vec3 r) { float k0 = length(p/r); float k1 = length(p/(r*r)); return k0*(k0-1.0)/k1; }\nfloat sdCapsule(vec3 p, float h, float r) { p.y -= clamp(p.y, 0.0, h); return length(p) - r; }\nfloat sdBox(vec3 p, vec3 b) { vec3 q = abs(p) - b; return length(max(q,0.0)) + min(max(q.x,max(q.y,q.z)),0.0); }\nfloat sdCylinder(vec3 p, float h, float r) { vec2 d = abs(vec2(length(p.xz),p.y)) - vec2(r,h); return min(max(d.x,d.y),0.0) + length(max(d,0.0)); }\nfloat sdCone(vec3 p, float r, float h) { vec2 q = h*vec2(r/h,-1.0); vec2 w = vec2(length(p.xz), p.y); return max(dot(w,normalize(q)), -p.y-h); }\n\n// Boolean operations\nfloat opUnion(float a, float b) { return min(a, b); }\nfloat opSubtract(float a, float b) { return max(-a, b); }\n\n// Noise for procedural detail\nfloat hash3(vec3 p) { p = fract(p * 0.3183099 + .1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }\nfloat noise3(vec3 x) {\n  vec3 i = floor(x); vec3 f = fract(x); f = f*f*(3.0-2.0*f);\n  return mix(mix(mix(hash3(i+vec3(0,0,0)), hash3(i+vec3(1,0,0)),f.x),\n                 mix(hash3(i+vec3(0,1,0)), hash3(i+vec3(1,1,0)),f.x),f.y),\n             mix(mix(hash3(i+vec3(0,0,1)), hash3(i+vec3(1,0,1)),f.x),\n                 mix(hash3(i+vec3(0,1,1)), hash3(i+vec3(1,1,1)),f.x),f.y),f.z);\n}\nfloat fbm3(vec3 x) {\n  float v = 0.0; float a = 0.5;\n  for (int i = 0; i < 3; ++i) { v += a * noise3(x); x = x * 2.0 + vec3(100.0); a *= 0.5; }\n  return v;\n}\n\n// Rotation helpers\nmat2 rot2(float a) { float s = sin(a), (7→18) ──────────────────────────\n\n// Rounded cone — tapered capsule (horns, tails, limbs with taper)\nfloat sdRoundCone(vec3 p, float r1, float r2, float h) {\n  vec2 q = vec2(length(p.xz), p.y);\n  float b = (r1-r2)/h;\n  float a = sqrt(1.0-b*b);\n  float k = dot(q,vec2(-b,a));\n  if(k < 0.0) return length(q) - r1;\n  if(k > a*h) return length(q-vec2(0.0,h)) - r2;\n  return dot(q, vec2(a,b)) - r1;\n}\n\n// Triangular prism — blades, fins, wedge shapes\nfloat sdTriPrism(vec3 p, vec2 h) {\n  vec3 q = abs(p);\n  return max(q.z-h.y,max(q.x*0.866025+p.y*0.5,-p.y)-h.x*0.5);\n}\n\n// Hexagonal prism — crystals, insect segments, honeycomb\nfloat sdHexPrism(vec3 p, vec2 h) {\n  vec3 q = abs(p);\n  return max(q.z-h.y,max(q.x*0.866025+q.y*0.5,q.y)-h.x);\n}\n\n// Octahedron — diamond/gem shapes\nfloat sdOctahedron(vec3 p, float s) {\n  p = abs(p);\n  float m = p.x+p.y+p.z-s;\n  vec3 q;\n  if(3.0*p.x < m) q = p.xyz;\n  else if(3.0*p.y < m) q = p.yzx;\n  else if(3.0*p.z < m) q = p.zxy;\n  else return m*0.57735027;\n  float k = clamp(0.5*(q.z-q.y+s),0.0,s);\n  return length(vec3(q.x,q.y-s+k,q.z-k));\n}\n\n// Pyramid — 4-sided pyramid with height h and unit base\nfloat sdPyramid(vec3 p, float h) {\n  float m2 = h*h + 0.25;\n  p.xz = abs(p.xz);\n  p.xz = (p.z>p.x) ? p.zx : p.xz;\n  p.xz -= 0.5;\n  vec3 q = vec3(p.z, h*p.y - 0.5*p.x, h*p.x + 0.5*p.y);\n  float s = max(-q.x, 0.0);\n  float t = clamp((q.y - 0.5*p.z)/(m2 + 0.25), 0.0, 1.0);\n  float a = m2*(q.x+s)*(q.x+s) + q.y*q.y;\n  float b = m2*(q.x+0.5*t)*(q.x+0.5*t) + (q.y-m2*t)*(q.y-m2*t);\n  float d2 = max(min(q.y,-q.x*m2-q.y*0.5), 0.0) > 0.0 ? 0.0 : min(a,b);\n  return sqrt((d2+q.z*q.z)/m2) * sign(max(q.z,-p.y));\n}\n\n// Solid angle (wedge) — claws, teeth, beaks\nfloat sdSolidAngle(vec3 p, vec2 c, float r) {\n  vec2 q = vec2(length(p.xz), p.y);\n  float l = length(q) - r;\n  float m = length(q - c*clamp(dot(q,c),0.0,r));\n  return max(l, m*sign(c.y*q.x-c.x*q.y));\n}\n\n// Infinite plane — ground, walls, wing membranes\nfloat sdPlane(vec3 p, vec3 n, float h) { return dot(p,n) + h; }\n\n// Revolution — spin 2D profile around Y axis (wheels, vases, columns)\nfloat sdRevolution(vec3 p, float sdfY, float sdfR, float offset) {\n  vec2 q = vec2(length(p.xz) - offset, p.y);\n  return length(q) - sdfR;\n}\n\n// Extrude linear — pull 2D circle into 3D cylinder along Y\nfloat sdExtrudeY(vec3 p, float r, float h) {\n  vec2 d = vec2(length(p.xz) - r, abs(p.y) - h);\n  return min(max(d.x,d.y),0.0) + length(max(d,0.0));\n}\n\n// Bezier quadratic curve distance (approximate)\nfloat sdBezierApprox(vec3 p, vec3 a, vec3 b, vec3 c) {\n  vec3 ab = b - a; vec3 bc = c - b; vec3 ac = c - a;\n  vec3 ap = p - a;\n  float t = clamp(dot(ap, ac) / dot(ac, ac), 0.0, 1.0);\n  vec3 pt = a + ab*2.0*t*(1.0-t) + ac*t*t;\n  return length(p - pt);\n}\n\n// ── New Combination Operations (3→10) ──────────────\n\n// Chamfer — flat bevel edge between two surfaces (mechanical, armor panel lines)\nfloat opChamfer(float a, float b, float r) {\n  return min(min(a,b), (a - r + b)*0.7071);\n}\n\n// Fillet — smooth round transition (organic)\nfloat opFillet(float a, float b, float r) {\n  vec2 u = max(vec2(r-a, r-b), vec2(0.0));\n  return max(r, min(a,b)) - length(u);\n}\n\n// Stair union — stepped blend (crystal growth, terraced)\nfloat opStairUnion(float a, float b, float r, float n) {\n  float s = r/n;\n  float u = b-r;\n  return min(min(a,b), 0.5*(u+a+abs(mod(u-a+s, 2.0*s)-s)));\n}\n\n// Column union — columnar blend (organic tissue, vein-like)\nfloat opColumnUnion(float a, float b, float r) {\n  if (abs(a) < r && abs(b) < r) {\n    float ar = a/r; float br = b/r;\n    float v = max(0.0, 1.0 - ar*ar - br*br);\n    return min(a,b) - r*(1.0 - sqrt(v));\n  }\n  return min(a,b);\n}\n\n// Groove — carved channel (panel seams, detail lines)\nfloat opGroove(float a, float b, float r, float d) {\n  return max(a, min(b+d, -b+r));\n}\n\n// ── New Domain Operations (5→15) ───────────────────\n\n// Repeat infinite — scales, rivets, tiles\ n(hairP.x * 5.0 + u_time * 2.0) * 0.015; // Wind sway\n  hairBack += sin(hairP.z * 3.0 + u_time * 1.5) * 0.01;\n  float hairTop = sdSphere(hairP, 1.0233) - 0.0250;\n  float hair = smin(hairTop, hairBack, 0.04);\n  body = smin(body, hair, 0.02);\n  // Staff (long shaft + orb)\n  vec3 staffP = p - vec3(0.5722, 0.0, 0.03);\n  float shaft = sdCapsule(staffP, 0.55, 0.015);\n  float orb = sdSphere(staffP - vec3(0.0, 0.55, 0.0), 0.04);\n  // Orb glow handled in material pass\n  body = min(body, min(shaft, orb));\n  // Wings\n  vec3 wingP = p;\n  wingP.x = abs(wingP.x);\n  wingP -= vec3(0.2650, 0.2100, 0.05);\n  wingP = rotZ(wingP, sin(u_time * 2.5) * 0.35 + 0.3);\n  float wings = sdBox(wingP - vec3(0.4306, 0.0, 0.0), vec3(0.4306, 0.015, 0.2584));\n  body = smin(body, wings, 0.0750);\n  // Tail\n  vec3 tailP = p - vec3(0.0, 0.0, 0.2650);\n  tailP.x += sin(tailP.z * 4.0 + u_time * 2.0) * 0.08;\n  float tail = sdCapsule(rotX(tailP, 1.8), 0.3465, 0.0466);\n  body = smin(body, tail, 0.1500);\n  return body;\n}\n\nfloat map(vec3 p) {\n  float entity = mapEntity(p);\n  float floor_ = p.y + 1.2;\n  return min(entity, floor_);\n}\n\nvec3 calcNormal(vec3 p) {\n  const float e = 0.001;\n  return normalize(vec3(\n    map(p + vec3(e,0,0)) - map(p - vec3(e,0,0)),\n    map(p + vec3(0,e,0)) - map(p - vec3(0,e,0)),\n    map(p + vec3(0,0,e)) - map(p - vec3(0,0,e))\n  ));\n}\n\nvoid main() {\n  vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;\n\n  // Orbiting camera\n  vec3 ro = vec3(sin(u_time * 0.25) * 2.5, 1.2, cos(u_time * 0.25) * 2.5 + 2.0);\n  vec3 ta = vec3(0.0, 0.3, 0.0);\n  vec3 ww = normalize(ta - ro);\n  vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n  vec3 vv = normalize(cross(uu, ww));\n  vec3 rd = normalize(uv.x * uu + uv.y * vv + 1.5 * ww);\n\n  // Raymarch\n  float t = 0.0;\n  for (int i = 0; i < 96; i++) {\n    float d = map(ro + rd * t);\n    if (d < 0.001 || t > 25.0) break;\n    t += d;\n  }\n\n  // Background: deep space\n  vec3 col = mix(vec3 n  return max(q.z-h.y,max(q.x*0.866025+p.y*0.5,-p.y)-h.x*0.5);\n}\n\n// Hexagonal prism — crystals, insect segments, honeycomb\nfloat sdHexPrism(vec3 p, vec2 h) {\n  vec3 q = abs(p);\n  return max(q.z-h.y,max(q.x*0.866025+q.y*0.5,q.y)-h.x);\n}\n\n// Octahedron — diamond/gem shapes\nfloat sdOctahedron(vec3 p, float s) {\n  p = abs(p);\n  float m = p.x+p.y+p.z-s;\n  vec3 q;\n  if(3.0*p.x < m) q = p.xyz;\n  else if(3.0*p.y < m) q = p.yzx;\n  else if(3.0*p.z < m) q = p.zxy;\n  else return m*0.57735027;\n  float k = clamp(0.5*(q.z-q.y+s),0.0,s);\n  return length(vec3(q.x,q.y-s+k,q.z-k));\n}\n\n// Pyramid — 4-sided pyramid with height h and unit base\nfloat sdPyramid(vec3 p, float h) {\n  float m2 = h*h + 0.25;\n  p.xz = abs(p.xz);\n  p.xz = (p.z>p.x) ? p.zx : p.xz;\n  p.xz -= 0.5;\n  vec3 q = vec3(p.z, h*p.y - 0.5*p.x, h*p.x + 0.5*p.y);\n  float s = max(-q.x, 0.0);\n  float t = clamp((q.y - 0.5*p.z)/(m2 + 0.25), 0.0, 1.0);\n  float a = m2*(q.x+s)*(q.x+s) + q.y*q.y;\n  float b = m2*(q.x+0.5*t)*(q.x+0.5*t) + (q.y-m2*t)*(q.y-m2*t);\n  float d2 = max(min(q.y,-q.x*m2-q.y*0.5), 0.0) > 0.0 ? 0.0 : min(a,b);\n  return sqrt((d2+q.z*q.z)/m2) * sign(max(q.z,-p.y));\n}\n\n// Solid angle (wedge) — claws, teeth, beaks\nfloat sdSolidAngle(vec3 p, vec2 c, float r) {\n  vec2 q = vec2(length(p.xz), p.y);\n  float l = length(q) - r;\n  float m = length(q - c*clamp(dot(q,c),0.0,r));\n  return max(l, m*sign(c.y*q.x-c.x*q.y));\n}\n\n// Infinite plane — ground, walls, wing membranes\nfloat sdPlane(vec3 p, vec3 n, float h) { return dot(p,n) + h; }\n\n// Revolution — spin 2D profile around Y axis (wheels, vases, columns)\nfloat sdRevolution(vec3 p, float sdfY, float sdfR, float offset) {\n  vec2 q = vec2(length(p.xz) - offset, p.y);\n  return length(q) - sdfR;\n}\n\n// Extrude linear — pull 2D circle into 3D cylinder along Y\nfloat sdExtrudeY(vec3 p, float r, float h) {\n  vec2 d = vec2(length(p.xz) - r, abs(p.y) - h);\n  return min(max(d.x,d.y),0.0) + length(max(d,0.0));\n}\n\n// Bezier quadrat n — radial dots (leopard, dalmatian)\nfloat spotPattern(vec3 p, float scale, float size) {\n  vec2 v = voronoi(p.xz * scale);\n  return smoothstep(size, size*0.5, v.x);\n}\n\n// Weave pattern — interlocking grid (fabric, chainmail)\nfloat weavePattern(vec3 p, float scale) {\n  vec2 uv = fract(p.xz * scale);\n  float h = step(0.5, uv.x);\n  float v = step(0.5, uv.y);\n  return abs(h - v);\n}\n\n// Triplanar projection — seamless 3D texture application\nvec3 triplanar(vec3 p, vec3 n, float scale) {\n  vec3 bf = abs(n); bf /= (bf.x+bf.y+bf.z);\n  float tx = noise3(vec3(p.yz * scale, 0.0));\n  float ty = noise3(vec3(p.xz * scale, 0.0));\n  float tz = noise3(vec3(p.xy * scale, 0.0));\n  return vec3(tx*bf.x + ty*bf.y + tz*bf.z);\n}\n\n// Scale pattern — Voronoi-based for dragons/reptiles\nfloat scalePattern(vec3 p, float scale) {\n  vec2 v = voronoi(p.xz * scale);\n  return smoothstep(0.4, 0.35, v.y);\n}\n\n\n// Gene-driven SDF entity (humanoid body plan)\nfloat mapEntity(vec3 p) {\n  // Motion genes control idle animation\n  p *= 1.0 + sin(u_time * 2.0000) * 0.0320;\np.x += sin(u_time * 1.0000) * 0.0200;\n\n  // Body plan compiled from bodyParams + appendages genes\n  \n  // Torso (morphology-scaled: exag=0.3000, musc=0.5000)\n  float torso = sdCapsule(p - vec3(0.0, 0.0, 0.0), 0.4700, 0.2702);\n  // Head (scaled by headToBodyRatio + exaggeration)\n  float head = sdSphere(p - vec3(0.0, 0.7504, 0.0), 0.1748);\n  // Neck\n  float neck = sdCapsule(p - vec3(0.0, 0.4700, 0.0), 0.1056, 0.1003);\n\n  // Arms (symmetric, morphology-scaled)\n  vec3 armP = p;\n  armP.x = abs(armP.x);\n  vec3 armStart = vec3(0.3202, 0.3760, 0.0);\n  vec3 armLocal = armP - armStart;\n  armLocal = rotZ(armLocal, 0.3 + sin(u_time * 2.0) * 0.08);\n  float arms = sdCapsule(armLocal, 0.5687, 0.1254);\n\n  // Legs (symmetric, morphology-scaled)\n  vec3 legP = p;\n  legP.x = abs(legP.x);\n  vec3 legStart = vec3(0.1351, -0.05, 0.0);\n  vec3 legLocal = legP - legStart;\n  float phase = p.x > 0.0 ? 1.0 : -1.0; ══════════════════════════════════════════\n\n// ── New Primitives (7→18) ──────────────────────────\n\n// Rounded cone — tapered capsule (horns, tails, limbs with taper)\nfloat sdRoundCone(vec3 p, float r1, float r2, float h) {\n  vec2 q = vec2(length(p.xz), p.y);\n  float b = (r1-r2)/h;\n  float a = sqrt(1.0-b*b);\n  float k = dot(q,vec2(-b,a));\n  if(k < 0.0) return length(q) - r1;\n  if(k > a*h) return length(q-vec2(0.0,h)) - r2;\n  return dot(q, vec2(a,b)) - r1;\n}\n\n// Triangular prism — blades, fins, wedge shapes\nfloat sdTriPrism(vec3 p, vec2 h) {\n  vec3 q = abs(p);\n  return max(q.z-h.y,max(q.x*0.866025+p.y*0.5,-p.y)-h.x*0.5);\n}\n\n// Hexagonal prism — crystals, insect segments, honeycomb\nfloat sdHexPrism(vec3 p, vec2 h) {\n  vec3 q = abs(p);\n  return max(q.z-h.y,max(q.x*0.866025+q.y*0.5,q.y)-h.x);\n}\n\n// Octahedron — diamond/gem shapes\nfloat sdOctahedron(vec3 p, float s) {\n  p = abs(p);\n  float m = p.x+p.y+p.z-s;\n  vec3 q;\n  if(3.0*p.x < m) q = p.xyz;\n  else if(3.0*p.y < m) q = p.yzx;\n  else if(3.0*p.z < m) q = p.zxy;\n  else return m*0.57735027;\n  float k = clamp(0.5*(q.z-q.y+s),0.0,s);\n  return length(vec3(q.x,q.y-s+k,q.z-k));\n}\n\n// Pyramid — 4-sided pyramid with height h and unit base\nfloat sdPyramid(vec3 p, float h) {\n  float m2 = h*h + 0.25;\n  p.xz = abs(p.xz);\n  p.xz = (p.z>p.x) ? p.zx : p.xz;\n  p.xz -= 0.5;\n  vec3 q = vec3(p.z, h*p.y - 0.5*p.x, h*p.x + 0.5*p.y);\n  float s = max(-q.x, 0.0);\n  float t = clamp((q.y - 0.5*p.z)/(m2 + 0.25), 0.0, 1.0);\n  float a = m2*(q.x+s)*(q.x+s) + q.y*q.y;\n  float b = m2*(q.x+0.5*t)*(q.x+0.5*t) + (q.y-m2*t)*(q.y-m2*t);\n  float d2 = max(min(q.y,-q.x*m2-q.y*0.5), 0.0) > 0.0 ? 0.0 : min(a,b);\n  return sqrt((d2+q.z*q.z)/m2) * sign(max(q.z,-p.y));\n}\n\n// Solid angle (wedge) — claws, teeth, beaks\nfloat sdSolidAngle(vec3 p, vec2 c, float r) {\n  vec2 q = vec2(length(p.xz), p.y);\n  float l = length(q) - r;\n  float m = length(q - c*clamp(dot(q,c),0.0,r));\n  return max(l, m*sign(c.y*q.x-c.x*q.y));\n}\n\n// Infinite plane — ground, walls, wing membranes\nfloat sdPlane(vec3 p, vec3 n, float h) { return dot(p,n) + h; }\n\n// Revolution — spin 2D profile around Y axis (wheels, vases, columns)\nfloat sdRevolution(vec3 p, float sdfY, float sdfR, float offset) {\n  vec2 q = vec2(length(p.xz) - offset, p.y);\n  return length(q) - sdfR;\n}\n\n// Extrude linear — pull 2D circle into 3D cylinder along Y\nfloat sdExtrudeY(vec3 p, float r, float h) {\n  vec2 d = vec2(length(p.xz) - r, abs(p.y) - h);\n  return min(max(d.x,d.y),0.0) + length(max(d,0.0));\n}\n\n// Bezier quadratic curve distance (approximate)\nfloat sdBezierApprox(vec3 p, vec3 a, vec3 b, vec3 c) {\n  vec3 ab = b - a; vec3 bc = c - b; vec3 ac = c - a;\n  vec3 ap = p - a;\n  float t = clamp(dot(ap, ac) / dot(ac, ac), 0.0, 1.0);\n  vec3 pt = a + ab*2.0*t*(1.0-t) + ac*t*t;\n  return length(p - pt);\n}\n\n// ── New Combination Operations (3→10) ──────────────\n\n// Chamfer — flat bevel edge between two surfaces (mechanical, armor panel lines)\nfloat opChamfer(float a, float b, float r) {\n  return min(min(a,b), (a - r + b)*0.7071);\n}\n\n// Fillet — smooth round transition (organic)\nfloat opFillet(float a, float b, float r) {\n  vec2 u = max(vec2(r-a, r-b), vec2(0.0));\n  return max(r, min(a,b)) - length(u);\n}\n\n// Stair union — stepped blend (crystal growth, terraced)\nfloat opStairUnion(float a, float b, float r, float n) {\n  float s = r/n;\n  float u = b-r;\n  return min(min(a,b), 0.5*(u+a+abs(mod(u-a+s, 2.0*s)-s)));\n}\n\n// Column union — columnar blend (organic tissue, vein-like)\nfloat opColumnUnion(float a, float b, float r) {\n  if (abs(a) < r && abs(b) < r) {\n    float ar = a/r; float br = b/r;\n    float v = max(0.0, 1.0 - ar*ar - br*br);\n    return min(a,b) - r*(1.0 - sqrt(v));\n  }\n  return min(a,b);\n}\n\n// Groove — carved channel (panel seams, detail lines)\nfloat opGroove(float a, float b, float r, float d) {\n  return max(a, min(b+d, -b+r));\n}\n\n// ── New Domain Operations (5→15) ───────────────────\n\n// Repeat infinite — scales, rivets, tiles\nvec3 opRepeatXYZ(vec3 p, vec3 s) { return mod(p+s*0.5, s) - s*0.5; }\n\n// Repeat limited — bounded repetition (teeth, spine ridges, fingers)\nvec3 opRepeatLimited(vec3 p, float s, vec3 lim) {\n  return p - s*clamp(round(p/s), -lim, lim);\n}\n\n// Repeat polar — radial repetition (petals, wheel spokes, tentacles)\nvec3 opRepeatPolar(vec3 p, float n) {\n  float angle = 6.2831853/n;\n  float a = atan(p.z, p.x);\n  float r = length(p.xz);\n  a = mod(a + angle*0.5, angle) - angle*0.5;\n  return vec3(r*cos(a), p.y, r*sin(a));\n}\n\n// Mirror — bilateral symmetry\nvec3 opMirror(vec3 p) { p.x = abs(p.x); return p; }\n\n// 4-fold symmetry (starfish, flowers)\nvec3 opSymmetry4(vec3 p) { p.xz = abs(p.xz); return p; }\n\n// Displacement — noise-driven surface perturbation\nfloat opDisplace(float d, vec3 p, float amt) {\n  return d + (noise3(p * 4.0) - 0.5) * amt;\n}\n\n// Onion — concentric shells (layered armor, auras, energy rings)\nfloat opOnion(float d, float thickness) { return abs(d) - thickness; }\n\n// Taper — progressive scaling along Y axis\nvec3 opTaper(vec3 p, float amount) {\n  float s = 1.0 - p.y * amount;\n  return vec3(p.x / max(s, 0.01), p.y, p.z / max(s, 0.01));\n}\n\n// Cheap bend — fast approximation for large deformations\nvec3 opCheapBend(vec3 p, float k) {\n  float c = cos(k*p.y); float s = sin(k*p.y);\n  mat2 m = mat2(c,-s,s,c);\n  vec2 xz = m * p.xz;\n  return vec3(xz.x, p.y, xz.y);\n}\n\n// ── New Texture Operations (0→7) ───────────────────\n\n// Voronoi — cell patterns (scales, cracks, veins)\nvec2 voronoi(vec2 x) {\n  vec2 n = floor(x); vec2 f = fract(x);\n  float md = 8.0; vec2 mr;\n  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++) {\n    vec2 g = vec2(float(i),float(j));\n    vec2 o = vec2(hash3(vec3(n+g,0.0)), hash3(vec3(n+g,1.0)));\n    vec2 r = g + o - f;\n    float d = dot(r,r);\n    if(d<md){ md=d; mr=r; }\n  }\n  return vec2(md, length(mr));\n}\n\n// Worley noise — organic cellular texture (2D for perf, projected from xz)\nfloat worley(vec3 p) {\n  vec2 n = floor(p.xz); vec2 ff = fract(p.xz);\n  float md = 1.0;\n  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++) {\n    vec2 g = vec2(float(i),float(j));\n    vec2 o = vec2(hash3(vec3(n+g,0.0)), hash3(vec3(n+g,1.0)));\n    float d = length(g + o - ff);\n    md = min(md, d);\n  }\n  return md;\n}\n\n// Stripe pattern — directional bands (tiger, zebra)\nfloat stripePattern(vec3 p, float freq, float thick) {\n  return smoothstep(thick, thick-0.05, abs(sin(p.x*freq + fbm3(p*2.0)*2.0)));\n}\n\n// Spot pattern — radial dots (leopard, dalmatian)\nfloat spotPattern(vec3 p, float scale, float size) {\n  vec2 v = voronoi(p.xz * scale);\n  return smoothstep(size, size*0.5, v.x);\n}\n\n// Weave pattern — interlocking grid (fabric, chainmail)\nfloat weavePattern(vec3 p, float scale) {\n  vec2 uv = fract(p.xz * scale);\n  float h = step(0.5, uv.x);\n  float v = step(0.5, uv.y);\n  return abs(h - v);\n}\n\n// Triplanar projection — seamless 3D texture application\nvec3 triplanar(vec3 p, vec3 n, float scale) {\n  vec3 bf = abs(n); bf /= (bf.x+bf.y+bf.z);\n  float tx = noise3(vec3(p.yz * scale, 0.0));\n  float ty = noise3(vec3(p.xz * scale, 0.0));\n  float tz = noise3(vec3(p.xy * scale, 0.0));\n  return vec3(tx*bf.x + ty*bf.y + tz*bf.z);\n}\n\n// Scale pattern — Voronoi-based for dragons/reptiles\nfloat scalePattern(vec3 p, float scale) {\n  vec2 v = voronoi(p.xz * scale);\n  return smoothstep(0.4, 0.35, v.y);\n}\n\n\n// Gene-driven SDF entity (humanoid body plan)\nfloat mapEntity(vec3 p) {\n  // Motion genes control idle animation\n  p *= 1.0 + sin(u_time * 2.0000) * 0.0320;\np.x += sin(u_time * 1.0000) * 0.0200;\n\n  // Body plan compiled from bodyParams + appendages genes\n  \n  // Torso (morphology-scaled: exag=0.3000, musc=0.5000)\n  float torso = sdCapsule(p - vec3(0.0, 0.0, 0.0), 0.4700, 0.3910);\n  // Head (scaled by headToBodyRatio + exaggeration)\n  float head = sdSphere(p - vec3(0.0, 0.7635, 0.0), 0.1879);\n  // Neck\n  float neck = sdCapsule(p - vec3(0.0, 0.4700, 0.0), 0.1056, 0.0992);\n\n  // Arms (symmetric, morphology-scaled)\n  vec3 armP = p;\n  armP.x = abs(armP.x);\n  vec3 armStart = vec3(0.4410, 0.3760, 0.0);\n  vec3 armLocal = armP - armStart;\n  armLocal = rotZ(armLocal, 0.3 + sin(u_time * 2.0) * 0.08);\n  float arms = sdCapsule(armLocal, 0.5592, 0.1240);\n\n  // Legs (symmetric, morphology-scaled)\n  vec3 legP = p;\n  legP.x = abs(legP.x);\n  vec3 legStart = vec3(0.1955, -0.05, 0.0);\n  vec3 legLocal = legP - legStart;\n  float phase = p.x > 0.0 ? 1.0 : -1.0;\n  legLocal = rotX(legLocal, sin(u_time * 3.0) * 0.15 * phase);\n  float legs = sdCapsule(legLocal - vec3(0.0, -0.05, 0.0), 0.6151, 0.1364);\n\n  // Combine with smooth blending\n  float body = smin(torso, neck, 0.0800);\n  body = smin(body, head, 0.0800);\n  body = smin(body, arms, 0.0480);\n  body = smin(body, legs, 0.0480);\n  // ── Face Features ──────────────────────────\n  vec3 headCenter = vec3(0.0, 0.7635, 0.0);\n  float faceForward = 0.1597;\n  // Robot eye sockets (sdBox carving)\n  vec3 eyePR = p; eyePR.x = abs(eyePR.x);\n  float eyeSocket = sdBox(eyePR - vec3(0.0526, 0.7916, faceForward), vec3(0.0271, 0.0135, 0.0225));\n  body = max(body, -eyeSocket - 0.005);\n  // Antenna\n  float antenna = sdCapsule(p - vec3(0.0, 0.9701, 0.0), 0.0564, 0.0038);\n  float antennaTip = sdSphere(p - vec3(0.0, 1.0265, 0.0), 0.0075);\n  body = smin(body, min(antenna, antennaTip), 0.01);\n  // Robot panel lines\n  float panelH = sdBox(p - vec3(0.0, 0.1880, 0.3714), vec3(0.3128, 0.002, 0.005));\n  float panelV = sdBox(p - vec3(0.0, 0.1880, 0.3714), vec3(0.002, 0.1880, 0.005));\n  body = max(body, -panelH - 0.001);\n  body = max(body, -panelV - 0.001);\n  // Visible joint cylinders\n  vec3 jointP = p; jointP.x = abs(jointP.x);\n  float shoulderJoint = sdCylinder(jointP - vec3(0.4210, 0.3525, 0.0), 0.01, 0.1488);\n  body = smin(body, shoulderJoint, 0.005);\n  return body;\n}\n\nfloat map(vec3 p) {\n  float entity = mapEntity(p);\n  float floor_ = p.y + 1.2;\n  return min(entity, floor_);\n}\n\nvec3 calcNormal(vec3 p) {\n  const float e = 0.001;\n  return normalize(vec3(\n    map(p + vec3(e,0,0)) - map(p - vec3(e,0,0)),\n    map(p + vec3(0,e,0)) - map(p - vec3(0,e,0)),\n    map(p + vec3(0,0,e)) - map(p - vec3(0,0,e))\n  ));\n}\n\nvoid main() {\n  vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;\n\n  // Orbiting camera\n  vec3 ro = vec3(sin(u_time * 0.25) * 2.5, 1.2, cos(u_time * 0.25) * 2.5 + 2.0);\n  vec3 ta = vec3(0.0, 0.3, 0.0);\n  vec3 ww = normalize(ta - ro);\n  vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n  vec3 vv = normalize(cross(uu, ww));\n  vec3 rd = normalize(uv.x * uu + uv.y * vv + 1.5 * ww);\n\n  // Raymarch\n  float t = 0.0;\n  for (int i = 0; i < 96; i++) {\n    float d = map(ro + rd * t);\n    if (d < 0.001 || t > 25.0) break;\n    t += d;\n  }\n\n  // Background: deep space\n  vec3 col = mix(vec3(0.015, 0.025, 0.06), vec3(0.0, 0.0, 0.02), rd.y);\n  float stars = pow(fract(sin(dot(rd.xy, vec2(12.9898, 78.233))) * 43758.5453), 180.0);\n  col += vec3(stars) * 0.6;\n\n  if (t < 25.0) {\n    vec3 hitPos = ro + rd * t;\n    vec3 n = calcNormal(hitPos);\n    vec3 lightDir = normalize(vec3(1.0, 1.2, -0.5));\n    vec3 viewDir = normalize(ro - hitPos);\n\n    float entityDist = mapEntity(hitPos);\n    bool isEntity = entityDist < 0.01;\n\n    if (isEntity) {\n      // Material from seed genes\n      vec3 albedo = vec3(0.3113, 0.2035, 0.3219);\n      vec3 secColor = vec3(0.2033, 0.3223, 0.2256);\n      vec3 accColor = vec3(0.4603, 0.5144, 0.6093);\n      albedo = mix(albedo, secColor, clamp(sin(hitPos.y * 5.0 + u_time) * 0.5 + 0.5, 0.0, 1.0));\n\n      float roughness = 0.8000;\n      float metallic = 0.8500;\n      float emission = 0.0000;\n\n      // Element effect from primaryElement gene\n      \n\n      // Species texture pattern\n      \n      // Robot circuit pattern\n      float circuits = weavePattern(hitPos, 8.0);\n      vec3 circuitGlow = accColor * 0.6;\n      albedo = mix(albedo, circuitGlow, circuits * 0.3);\n\n      // Style-specific shading: cyberpunk\n      \n      // Cyberpunk: Neon-lit, high contrast\n      float dif = max(dot(n, lightDir), 0.0);\n      float celDif = celShade(dif, 3.0);\n      float rim = pow(1.0 - max(dot(n, viewDir), 0.0), 3.0);\n      col = albedo * (celDif * 0.5 + 0.1) + albedo * emission * 1.5;\n      col += accColor * rim * 1.5; // Neon rim glow\n      col += vec3(0.0, emission * 0.1, emission * 0.15); // Blue/cyan ambient neon\n    \n    } else {\n      // Floor\n      float f = mod(floor(hitPos.x) + floor(hitPos.z), 2.0);\n      col = mix(vec3(0.03), vec3(0.055), f) * (max(dot(n, lightDir), 0.0) * 0.5 + 0.3);\n    }\n  }\n\n  // Fog\n  col = mix(col, vec3(0.015, 0.025, 0.06), 1.0 - exp(-0.04 * t));\n\n  // v2: Interactive uniforms — emotion, transformation, power activation\n  // Emotion: shifts aura color (calm=cool tones, rage=hot tones) and intensity\n  if (u_emotion > 0.01) {\n    vec3 emotionColor = mix(vec3(0.2, 0.4, 0.8), vec3(1.0, 0.2, 0.05), u_emotion);\n    float emotionGlow = u_emotion * 0.5;\n    col += emotionColor * emotionGlow * (0.5 + 0.5 * sin(u_time * 3.0 + u_emotion * 6.0));\n  }\n\n  // Transform: morphology scale shift + color intensity boost + aura burst\n  if (u_transform > 0.01) {\n    float transformPulse = u_transform * (0.7 + 0.3 * sin(u_time * 4.0));\n    col *= 1.0 + transformPulse * 0.5;\n    col += vec3(transformPulse * 0.15, transformPulse * 0.1, transformPulse * 0.25);\n  }\n\n  // Power: ability VFX activation — screen energy overlay\n  if (u_power > 0.01) {\n    float powerWave = u_power * abs(sin(u_time * 6.0));\n    vec2 powerUV = gl_FragCoord.xy / u_resolution.xy - 0.5;\n    float powerDist = length(powerUV);\n    float powerRing = smoothstep(0.3, 0.25, abs(powerDist - 0.3 * u_power));\n    col += vec3(0.3, 0.5, 1.0) * powerRing * powerWave;\n  }\n\n  // Tone mapping (ACES)\n  col = (col * (2.51 * col + 0.03)) / linear — pull 2D circle into 3D cylinder along Y\nfloat sdExtrudeY(vec3 p, float r, float h) {\n  vec2 d = vec2(length(p.xz) - r, abs(p.y) - h);\n  return min(max(d.x,d.y),0.0) + length(max(d,0.0));\n}\n\n// Bezier quadratic curve distance (approximate)\nfloat sdBezierApprox(vec3 p, vec3 a, vec3 b, vec3 c) {\n  vec3 ab = b - a; vec3 bc = c - b; vec3 ac = c - a;\n  vec3 ap = p - a;\n  float t = clamp(dot(ap, ac) / dot(ac, ac), 0.0, 1.0);\n  vec3 pt = a + ab*2.0*t*(1.0-t) + ac*t*t;\n  return length(p - pt);\n}\n\n// ── New Combination Operations (3→10) ──────────────\n\n// Chamfer — flat bevel edge between two surfaces (mechanical, armor panel lines)\nfloat opChamfer(float a, float b, float r) {\n  return min(min(a,b), (a - r + b)*0.7071);\n}\n\n// Fillet — smooth round transition (organic)\nfloat opFillet(float a, float b, float r) {\n  vec2 u = max(vec2(r-a, r-b), vec2(0.0));\n  return max(r, min(a,b)) - length(u);\n}\n\n// Stair union — stepped blend (crystal growth, terraced)\nfloat opStairUnion(float a, float b, float r, float n) {\n  float s = r/n;\n  float u = b-r;\n  return min(min(a,b), 0.5*(u+a+abs(mod(u-a+s, 2.0*s)-s)));\n}\n\n// Column union — columnar blend (organic tissue, vein-like)\nfloat opColumnUnion(float a, float b, float r) {\n  if (abs(a) < r && abs(b) < r) {\n    float ar = a/r; float br = b/r;\n    float v = max(0.0, 1.0 - ar*ar - br*br);\n    return min(a,b) - r*(1.0 - sqrt(v));\n  }\n  return min(a,b);\n}\n\n// Groove — carved channel (panel seams, detail lines)\nfloat opGroove(float a, float b, float r, float d) {\n  return max(a, min(b+d, -b+r));\n}\n\n// ── New Domain Operations (5→15) ───────────────────\n\n// Repeat infinite — scales, rivets, tiles\nvec3 opRepeatXYZ(vec3 p, vec3 s) { return mod(p+s*0.5, s) - s*0.5; }\n\n// Repeat limited — bounded repetition (teeth, spine ridges, fingers)\nvec3 opRepeatLimited(vec3 p, float s, vec3 lim) {\n  return p - s*clamp(round(p/s), -lim, lim);\n}\n\n// Repeat polar — radial repetition (petals, whe urn md;\n}\n\n// Stripe pattern — directional bands (tiger, zebra)\nfloat stripePattern(vec3 p, float freq, float thick) {\n  return smoothstep(thick, thick-0.05, abs(sin(p.x*freq + fbm3(p*2.0)*2.0)));\n}\n\n// Spot pattern — radial dots (leopard, dalmatian)\nfloat spotPattern(vec3 p, float scale, float size) {\n  vec2 v = voronoi(p.xz * scale);\n  return smoothstep(size, size*0.5, v.x);\n}\n\n// Weave pattern — interlocking grid (fabric, chainmail)\nfloat weavePattern(vec3 p, float scale) {\n  vec2 uv = fract(p.xz * scale);\n  float h = step(0.5, uv.x);\n  float v = step(0.5, uv.y);\n  return abs(h - v);\n}\n\n// Triplanar projection — seamless 3D texture application\nvec3 triplanar(vec3 p, vec3 n, float scale) {\n  vec3 bf = abs(n); bf /= (bf.x+bf.y+bf.z);\n  float tx = noise3(vec3(p.yz * scale, 0.0));\n  float ty = noise3(vec3(p.xz * scale, 0.0));\n  float tz = noise3(vec3(p.xy * scale, 0.0));\n  return vec3(tx*bf.x + ty*bf.y + tz*bf.z);\n}\n\n// Scale pattern — Voronoi-based for dragons/reptiles\nfloat scalePattern(vec3 p, float scale) {\n  vec2 v = voronoi(p.xz * scale);\n  return smoothstep(0.4, 0.35, v.y);\n}\n\n\n// Gene-driven SDF entity (humanoid body plan)\nfloat mapEntity(vec3 p) {\n  // Motion genes control idle animation\n  p *= 1.0 + sin(u_time * 2.0000) * 0.0320;\np.x += sin(u_time * 1.0000) * 0.0200;\n\n  // Body plan compiled from bodyParams + appendages genes\n  \n  // Torso (morphology-scaled: exag=0.3000, musc=0.5000)\n  float torso = sdCapsule(p - vec3(0.0, 0.0, 0.0), 0.4700, 0.1955);\n  // Head (scaled by headToBodyRatio + exaggeration)\n  float head = sdSphere(p - vec3(0.0, 0.7556, 0.0), 0.1800);\n  // Neck\n  float neck = sdCapsule(p - vec3(0.0, 0.4700, 0.0), 0.1056, 0.0997);\n\n  // Arms (symmetric, morphology-scaled)\n  vec3 armP = p;\n  armP.x = abs(armP.x);\n  vec3 armStart = vec3(0.2455, 0.3760, 0.0);\n  vec3 armLocal = armP - armStart;\n  armLocal = rotZ(armLocal, 0.3 + sin(u_time * 2.0) * 0.08);\n  float arms = sdCapsule(armLocal, 0.5
